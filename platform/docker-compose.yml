# Local development / evaluation stack:
#   docker compose up -d --build         # postgres + redis + migrations + app
#   docker compose run --rm migrate npm run db:seed   # optional demo data
# App: http://localhost:3000
#
# For day-to-day development run only the infrastructure and use `npm run dev`:
#   docker compose up -d postgres redis

name: delta-itsm

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm
      POSTGRES_DB: itsm
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm -d itsm"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies migrations, then exits. The app waits for it.
  migrate:
    build: { context: ., target: builder }
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://itsm:itsm@postgres:5432/itsm
      DIRECT_DATABASE_URL: postgresql://itsm:itsm@postgres:5432/itsm
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://itsm:itsm@postgres:5432/itsm
      DIRECT_DATABASE_URL: postgresql://itsm:itsm@postgres:5432/itsm
      REDIS_URL: redis://redis:6379
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${AUTH_URL:-http://localhost:3000}
      # Development default only — set a real secret for anything shared.
      AUTH_SECRET: ${AUTH_SECRET:-docker-dev-only-secret-change-me-0123456789abcdef}
      AUTH_TRUST_HOST: "true"
      TRUST_PROXY: "0"
      # Evaluation stack: attachments on a local volume. Production uses
      # S3/R2 (set STORAGE_DRIVER=s3 and the S3_* variables instead).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ALLOW_LOCAL: "1"
      LOCAL_STORAGE_DIR: /app/.data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - attachments:/app/.data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
  redisdata:
  attachments:
